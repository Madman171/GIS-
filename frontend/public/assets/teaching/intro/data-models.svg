<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">先辨认数据表达，再判断能回答什么问题</title><desc id="d">公交站用点、道路中心线用线、校区边界用面；栅格按规则行列像元记录值。表达方式取决于任务。</desc><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#658FAA"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="1000" height="540" fill="#F7F6F1"/><text x="40" y="54" font-size="32" fill="#24343B">先辨认数据表达，再判断能回答什么问题</text><text x="40" y="98" font-size="23" fill="#24343B">自拟教学示意；不代表真实道路或实测数据</text><text x="70" y="170" font-size="27" fill="#24343B">点：站点位置</text><circle cx="220" cy="255" r="13" fill="#658FAA"/><text x="530" y="170" font-size="27" fill="#24343B">线：道路中心线</text><path d="M540 290L655 230L800 280" fill="none" stroke="#658FAA" stroke-width="10" stroke-linecap="round" /><text x="70" y="365" font-size="27" fill="#24343B">面：校区边界</text><path d="M100 400L340 400L300 490L130 480Z" fill="#DCE8E5" stroke="#7EAAA0" stroke-width="5"/><text x="530" y="365" font-size="27" fill="#24343B">栅格：规则像元与取值</text><rect x="555" y="395" width="58" height="40" fill="#C8DAE1" stroke="#FFFFFF" stroke-width="2"/><text x="574" y="423" font-size="20" fill="#24343B">10</text><rect x="613" y="395" width="58" height="40" fill="#AEC6D0" stroke="#FFFFFF" stroke-width="2"/><text x="632" y="423" font-size="20" fill="#24343B">11</text><rect x="671" y="395" width="58" height="40" fill="#92B2C0" stroke="#FFFFFF" stroke-width="2"/><text x="690" y="423" font-size="20" fill="#24343B">12</text><rect x="729" y="395" width="58" height="40" fill="#C8DAE1" stroke="#FFFFFF" stroke-width="2"/><text x="748" y="423" font-size="20" fill="#24343B">13</text><rect x="555" y="435" width="58" height="40" fill="#AEC6D0" stroke="#FFFFFF" stroke-width="2"/><text x="574" y="463" font-size="20" fill="#24343B">11</text><rect x="613" y="435" width="58" height="40" fill="#92B2C0" stro