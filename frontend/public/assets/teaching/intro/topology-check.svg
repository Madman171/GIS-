<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">同样有端点，处理方式可能不同</title><desc id="d">真实尽端路应保留；现场应连通而数据留有缝隙需核实；桥上桥下无转换设施时不能误接。</desc><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#658FAA"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="1000" height="540" fill="#F7F6F1"/><text x="40" y="54" font-size="32" fill="#24343B">同样有端点，处理方式可能不同</text><text x="40" y="98" font-size="23" fill="#24343B">自拟教学示意；不代表真实道路或实测数据</text><text x="40" y="165" font-size="27" fill="#24343B">① 真实尽端路</text><path d="M100 220V355M100 280H260" fill="none" stroke="#658FAA" stroke-width="12" stroke-linecap="round" /><circle cx="260" cy="280" r="10" fill="#24343B"/><text x="40" y="425" font-size="26" fill="#24343B">保留真实结构</text><text x="355" y="165" font-size="27" fill="#24343B">② 本应相接却留缝</text><path d="M390 280H480M500 220V355M500 280H620" fill="none" stroke="#658FAA" stroke-width="12" stroke-linecap="round" /><circle cx="480" cy="280" r="8" fill="#AC645B"/><text x="355" y="425" font-size="25" fill="#24343B">核实后按规则修正</text><text x="700" y="165" font-size="27" fill="#24343B">③ 无连接的跨层路</text><path d="M835 210V360" fill="none" stroke="#7EAAA0" stroke-width="15" stroke-linecap="round" /><path d="M730 280H950" fill="none" stroke="#F7F6F1" stroke-width="44" stroke-linecap="round" /><path d="M730 280H950" fill="none" stroke="#658FAA" stroke-width="15" stroke-linecap="round" /><path d="M792 258H878M792 302H878" fill="none" stroke="#658FAA" stroke-width="3" stroke-linecap="round" /><text x="700" y="425" font-size="25" fill="#24343B">不能凭靠近误接</text><text x="40" y="505" font-size="25" fill="#24343B">检查标记是线索；处理依据是真实道路、数据规范与适用规则。</text></svg>