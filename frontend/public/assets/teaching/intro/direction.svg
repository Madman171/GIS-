<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">箭头定义本题允许的方向</title><desc id="d">仅有P到Q、Q到R、R到P三条有向边。Q到P可绕经R，不能自行补出直接反向边。</desc><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#658FAA"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="1000" height="540" fill="#F7F6F1"/><text x="40" y="54" font-size="32" fill="#24343B">箭头定义本题允许的方向</text><text x="40" y="98" font-size="23" fill="#24343B">自拟教学示意；不代表真实道路或实测数据</text><path d="M210 210H755" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><path d="M767 230L510 415" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><path d="M475 415L206 235" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><circle cx="180" cy="210" r="23" fill="#24343B"/><text x="171" y="220" font-size="28" fill="#FFFFFF">P</text><circle cx="790" cy="210" r="23" fill="#24343B"/><text x="781" y="220" font-size="28" fill="#FFFFFF">Q</text><circle cx="490" cy="435" r="23" fill="#24343B"/><text x="481" y="445" font-size="28" fill="#FFFFFF">R</text><text x="335" y="182" font-size="27" fill="#24343B">P → Q</text><text x="685" y="345" font-size="27" fill="#24343B">Q → R</text><text x="195" y="345" font-size="27" fill="#24343B">R → P</text><text x="70" y="510" font-size="25" fill="#24343B">从 Q 到 P：可沿 Q→R→P；图中没有直接的 Q→P 边。</text></svg>