<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="t d"><title id="t">比较累计成本，不只看第一条边</title><desc id="d">仅S到A为3千米、A到T为3千米、S到B为2千米、B到T为5千米。均为合法有向边，无额外延误。</desc><defs><marker id="a" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#658FAA"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="1000" height="540" fill="#F7F6F1"/><text x="40" y="54" font-size="32" fill="#24343B">比较累计成本，不只看第一条边</text><text x="40" y="98" font-size="23" fill="#24343B">自拟教学示意；不代表真实道路或实测数据</text><path d="M145 267L457 160" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><path d="M510 160L830 267" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><path d="M145 290L457 397" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><path d="M510 397L830 290" fill="none" stroke="#658FAA" stroke-width="8" stroke-linecap="round" marker-end="url(#a)"/><circle cx="120" cy="280" r="23" fill="#24343B"/><text x="111" y="290" font-size="28" fill="#FFFFFF">S</text><circle cx="485" cy="150" r="23" fill="#24343B"/><text x="476" y="160" font-size="28" fill="#FFFFFF">A</text><circle cx="485" cy="410" r="23" fill="#24343B"/><text x="476" y="420" font-size="28" fill="#FFFFFF">B</text><circle cx="860" cy="280" r="23" fill="#24343B"/><text x="851" y="290" font-size="28" fill="#FFFFFF">T</text><text x="260" y="188" font-size="27" fill="#24343B">3 km</text><text x="655" y="188" font-size="27" fill="#24343B">3 km</text><text x="260" y="395" font-size="27" fill="#24343B">2 km</text><text x="655" y="395" font-size="27" fill="#24343B">5 km</text><text x="65" y="470" font-size="27" fill="#24343B">经 A：3＋3＝6 km；经 B：2＋5＝7 km。</text><text x="65" y="515" font-size="24" fill="#24343B">给定沿道路长度；线段不按长度比例绘制，四条边均允许使用。</text></svg>