<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
    <title id="title">图2：共享节点：说明路段如何衔接</title><desc id="desc">A在西、B在东、C在北、D在南，四条双向路段A—N、N—B、C—N、N—D共享节点N。本题车辆无额外禁行或禁转；圆点示意网络中已经存在的连接。</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24343B"/></marker><marker id="turn-arrow" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#AC645B"/></marker></defs>
    <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}</style>
    <rect width="1200" height="800" fill="#F7F6F1"/>
    <text x="52" y="68" font-size="35" font-weight="600" fill="#24343B" text-anchor="start">图2  共享节点：说明路段如何衔接</text><text x="52" y="115" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">自拟教学示意 · 图上方为北 · 字母表示本课位置或节点</text><text x="52" y="177" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">路网示意：四条路段共享 N</text><path d="M395 250L395 610" fill="none" stroke="#7EAAA0" stroke-width="30" stroke-linecap="round" /><path d="M130 430L650 430" fill="none" stroke="#658FAA" stroke-width="30" stroke-linecap="round" /><text x="92" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">A</text><text x="686" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">B</text><text x="395" y="222" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">C</text><text x="395" y="657" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">D</text><circle cx="395" cy="430" r="23" fill="#24343B" stroke="#F7F6F1" stroke-width="5"/><text x="438" y="486" font-size="27" font-weight="500" fill="#24343B" text-anchor="start">共享节点 N</text><text x="765" y="207" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">连接记录</text><text x="795" y="286" font-size="31" font-weight="500" fill="#24343B" text-anchor="start">A—N</text><text x="795" y="348" font-size="31" font-weight="500" fill="#24343B" text-anchor="start">N—B</text><text x="795" y="410" font-size="31" font-weight="500" fill="#24343B" text-anchor="start">C—N</text><text x="795" y="472" font-size="31" font-weight="500" fill="#24343B" text-anchor="start">N—D</text><text x="765" y="545" font-size="27" font-weight="500" fill="#24343B" text-anchor="start">本例均双向可用</text><text x="765" y="590" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">本题车辆无额外禁行</text><text x="765" y="632" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">所讨论的通行无禁转</text><text x="52" y="713" font-size="28" font-weight="500" fill="#24343B" text-anchor="start">教学设定：真实道路同层相接，并已按本课建网规则建立连接。</text><text x="52" y="762" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">圆点是对网络关系的示意；在截图上补画圆点不会自动改变数据。</text>
