<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
    <title id="title">图1：分层立交：交叉处没有转换连接</title><desc id="desc">A—B在桥上，C—D在桥下，交叉处没有匝道，不能在此直接互相转入。桥下道路连续通过。右侧按上下两层分开画出道路，示意层级，不表示方位。</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24343B"/></marker><marker id="turn-arrow" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#AC645B"/></marker></defs>
    <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}</style>
    <rect width="1200" height="800" fill="#F7F6F1"/>
    <text x="52" y="68" font-size="35" font-weight="600" fill="#24343B" text-anchor="start">图1  分层立交：交叉处没有转换连接</text><text x="52" y="115" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">自拟教学示意 · 左侧俯视图上方为北 · 右侧仅示意层级</text><text x="52" y="177" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">俯视图：位置交叉</text><path d="M395 250L395 610" fill="none" stroke="#7EAAA0" stroke-width="30" stroke-linecap="round" /><path d="M130 430L650 430" fill="none" stroke="#F7F6F1" stroke-width="68" stroke-linecap="round" /><path d="M130 430L650 430" fill="none" stroke="#658FAA" stroke-width="30" stroke-linecap="round" /><path d="M330 397L460 397" fill="none" stroke="#658FAA" stroke-width="4" stroke-linecap="round" /><path d="M330 463L460 463" fill="none" stroke="#658FAA" stroke-width="4" stroke-linecap="round" /><text x="92" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">A</text><text x="686" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">B</text><text x="395" y="222" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">C</text><text x="395" y="657" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">D</text><text x="486" y="375" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">上层 A—B</text><text x="441" y="588" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">下层 C—D</text><text x="765" y="177" font-size="27" font-weight="600" fill="#24343B" text-anchor="start">层级关系（不表示方位）</text><path d="M785 330L1100 330" fill="none" stroke="#658FAA" stroke-width="26" stroke-linecap="round" /><text x="942" y="285" font-size="27" font-weight="500" fill="#24343B" text-anchor="middle">上层：A—B</text><path d="M785 565L1100 565" fill="none" stroke="#7EAAA0" stroke-width="26" stroke-linecap="round" /><text x="942" y="625" font-size="27" font-weight="500" fill="#24343B" text-anchor="middle">下层：C—D</text><text x="942" y="425" font-size="27" font-weight="500" fill="#24343B" text-anchor="middle">交叉处无转换通道</text><text x="52" y="713" font-size="28" font-weight="500" fill="#24343B" text-anchor="start">已知条件：交叉处没有匝道或其他转换设施；桥下道路连续通过。</text><text x="52" y="762" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">判断对象是这个交点的直接转换，不排除经别处连接绕行。</text>
    </svg>