<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
    <title id="title">图4：三步判断：把结论和依据一起说清楚</title><desc id="desc">先看道路几何位置，再根据实际设施和建网记录检查连接，最后核对本次车辆、方向与转向限制。任一步资料不足都应保留判断；明确缺少连接或明确转向禁止，才可否定相应的直接转换或转向。</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24343B"/></marker><marker id="turn-arrow" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#AC645B"/></marker></defs>
    <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}</style>
    <rect width="1200" height="820" fill="#F7F6F1"/>
    <text x="52" y="68" font-size="35" font-weight="600" fill="#24343B" text-anchor="start">图4  三步判断：把结论和依据一起说清楚</text><text x="52" y="115" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">自拟教学示意 · 按给定条件判断 · 不依赖具体软件</text><rect x="52" y="175" width="720" height="132" rx="10" fill="#FFFFFF" stroke="#C4CFD1" stroke-width="2"/><text x="77" y="227" font-size="35" font-weight="600" fill="#658FAA" text-anchor="start">01</text><text x="150" y="227" font-size="31" font-weight="600" fill="#24343B" text-anchor="start">看几何位置</text><text x="150" y="276" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">道路在哪里相交、接近或重叠？</text><path d="M410 315L410 339" fill="none" stroke="#24343B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="52" y="350" width="720" height="132" rx="10" fill="#FFFFFF" stroke="#C4CFD1" stroke-width="2"/><text x="77" y="402" font-size="35" font-weight="600" fill="#658FAA" text-anchor="start">02</text><text x="150" y="402" font-size="31" font-weight="600" fill="#24343B" text-anchor="start">查网络连接</text><text x="150" y="451" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">实际设施和建网记录是否支持所需衔接？</text><path d="M410 490L410 514" fill="none" stroke="#24343B" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="52" y="525" width="720" height="132" rx="10" fill="#FFFFFF" stroke="#C4CFD1" stroke-width="2"/><text x="77" y="577" font-size="35" font-weight="600" fill="#658FAA" text-anchor="start">03</text><text x="150" y="577" font-size="31" font-weight="600" fill="#24343B" text-anchor="start">核对通行限制</text><text x="150" y="626" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">本次车辆、通行方向和转向是否允许？</text><rect x="815" y="175" width="333" height="198" rx="10" fill="#EEE8DC"/><text x="840" y="221" font-size="28" font-weight="600" fill="#24343B" text-anchor="start">任一步资料不足</text><text x="840" y="269" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">先列出缺失条件</text><text x="840" y="316" font-size="26" font-weight="400" fill="#24343B" text-anchor="start">暂时保留判断</text><text x="830" y="426" font-size="27" font-weight="600" fill="#24343B" text-anchor="start">连接已知不成立</text><text x="830" y="467" font-size="25" font-weight="400" fill="#24343B" text-anchor="start">不能在此直接转换</text><text x="830" y="558" font-size="27" font-weight="600" fill="#24343B" text-anchor="start">指定转向已知禁止</text><text x="830" y="599" font-size="25" font-weight="400" fill="#24343B" text-anchor="start">这一次转向不可用</text><text x="52" y="731" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">本次转换可行：所需连接已确认，并且适用的通行限制均满足。</text><text x="52" y="782" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">图上交叉只是位置线索；它既不能单独证明可通行，也不能单独证明不连通。</text>
    </svg>