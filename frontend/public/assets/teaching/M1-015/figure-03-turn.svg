<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
    <title id="title">图3：指定转向受限：连接不等于任意通行</title><desc id="desc">图上方为北，A在西。红色路线从A经N向北到C，是本例禁止的左转。共享节点N保留，A经N到B以及C经N到D仍允许。右侧叉号表示指定转向禁止，不表示C道路封闭。</desc>
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#24343B"/></marker><marker id="turn-arrow" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#AC645B"/></marker></defs>
    <style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif}</style>
    <rect width="1200" height="800" fill="#F7F6F1"/>
    <text x="52" y="68" font-size="35" font-weight="600" fill="#24343B" text-anchor="start">图3  指定转向受限：连接不等于任意通行</text><text x="52" y="115" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">自拟教学示意 · 图上方为北 · 字母表示本课位置或节点</text><text x="52" y="177" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">连接关系保留，只增加指定禁转</text><path d="M395 250L395 610" fill="none" stroke="#7EAAA0" stroke-width="30" stroke-linecap="round" /><path d="M130 430L650 430" fill="none" stroke="#658FAA" stroke-width="30" stroke-linecap="round" /><text x="92" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">A</text><text x="686" y="440" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">B</text><text x="395" y="222" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">C</text><text x="395" y="657" font-size="30" font-weight="500" fill="#24343B" text-anchor="middle">D</text><path d="M160 430H395V275" fill="none" stroke="#AC645B" stroke-width="11" marker-end="url(#turn-arrow)"/><circle cx="395" cy="430" r="23" fill="#24343B" stroke="#F7F6F1" stroke-width="5"/><text x="438" y="486" font-size="27" font-weight="500" fill="#24343B" text-anchor="start">共享节点 N</text><path d="M755 250L790 285" fill="none" stroke="#AC645B" stroke-width="7" stroke-linecap="round" /><path d="M755 285L790 250" fill="none" stroke="#AC645B" stroke-width="7" stroke-linecap="round" /><text x="820" y="280" font-size="29" font-weight="600" fill="#24343B" text-anchor="start">这一左转禁止</text><text x="765" y="350" font-size="32" font-weight="600" fill="#AC645B" text-anchor="start">A → N → C</text><text x="765" y="442" font-size="27" font-weight="500" fill="#24343B" text-anchor="start">N 和各路段连接保留</text><text x="765" y="510" font-size="27" font-weight="400" fill="#24343B" text-anchor="start">A → N → B 仍允许</text><text x="765" y="565" font-size="27" font-weight="400" fill="#24343B" text-anchor="start">C → N → D 仍允许</text><text x="765" y="620" font-size="27" font-weight="400" fill="#24343B" text-anchor="start">未把 C 路段封闭</text><text x="52" y="713" font-size="28" font-weight="500" fill="#24343B" text-anchor="start">教学设定：除 A→N→C 禁止外，其余通行条件均沿用图2。</text><text x="52" y="762" font-size="25" font-weight="400" fill="#465B65" text-anchor="start">禁止的是 A→N→C 这一次动作，不是所有经过 N 的通行。</text>
    </svg>