name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.lock.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e

      - name: Check whitespace errors
        run: git diff --check

      - name: Build backend image
        run: docker build -f deploy/backend.Dockerfile -t gis-knowledge-platform-backend:ci .

      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t gis-knowledge-platform-frontend:ci .
