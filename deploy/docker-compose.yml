name: gis-knowledge-platform

services:
  neo4j:
    image: neo4j:5.26.30-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1;' >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j-init:
    image: neo4j:5.26.30-community
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      DB_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ../data:/imports:ro
      - ./init-neo4j.sh:/init-neo4j.sh:ro
    entrypoint: ["/bin/sh", "/init-neo4j.sh"]
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      DEEPSEEK_TIMEOUT_SECONDS: 30
      DEEPSEEK_MAX_TOKENS: 800
      DEEPSEEK_TEMPERATURE: 0.2
      KG_MAX_LEARNING_PATH_LENGTH: ${KG_MAX_LEARNING_PATH_LENGTH:-8}
      ENABLE_TOPOLOGY_CHECK: ${ENABLE_TOPOLOGY_CHECK:-true}
      TOPOLOGY_COORDINATE_TOLERANCE: ${TOPOLOGY_COORDINATE_TOLERANCE:-1.0}
      ANSWER_MAX_REFERENCES: ${ANSWER_MAX_REFERENCES:-6}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-5}
      CHAT_RATE_LIMIT_WHITELIST: ${CHAT_RATE_LIMIT_WHITELIST:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
    volumes:
      - ../backend/media:/app/media:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:80"

volumes:
  neo4j_data:
  neo4j_logs:
